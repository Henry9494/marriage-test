<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>제형 ❤️ 민아 결혼합니다</title>
    <meta
      name="description"
      content="2026년 9월 20일 일요일 오후 1시 마리아쥬스퀘어 웨딩홀"
    />

    <!-- Open Graph (카카오톡, 페이스북 등) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="제형 ❤️ 민아 결혼합니다" />
    <meta
      property="og:description"
      content="2026년 9월 20일 일요일 오후 1시 마리아쥬스퀘어 웨딩홀"
    />

    <meta property="og:url" content="https://marry.260920.today" />
    <!-- og:image는 반드시 절대 URL (상대경로는 일부 크롤러에서 무시됨) -->
    <meta
      property="og:image"
      content="https://marry.260920.today/meta-content-small.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="제형 ❤️ 민아 결혼합니다" />
    <meta property="og:locale" content="ko_KR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="제형 ❤️ 민아 결혼합니다" />
    <meta
      name="twitter:description"
      content="2026년 9월 20일 일요일 오후 1시 마리아쥬스퀘어 웨딩홀"
    />
    <meta
      name="twitter:image"
      content="https://marry.260920.today/meta-content-small.jpg"
    />

    <!-- OG를 읽지 않는 구형 크롤러용 폴백 (image_src / microdata) -->
    <link
      rel="image_src"
      href="https://marry.260920.today/meta-content-small.jpg"
    />
    <meta
      itemprop="image"
      content="https://marry.260920.today/meta-content-small.jpg"
    />
  </head>
  <body>
    <!--
      WeChat 공유 썸네일용 정적 이미지.
      WeChat 크롤러는 OG 태그를 읽지 않고 DOM 내 <img> 중 앞쪽의 큰 이미지를 썸네일로 고른다.
      이 앱은 SPA라 크롤러가 보는 HTML에 이미지가 없으므로 여기에 정적으로 삽입한다.
      display:none은 크롤러가 무시하므로 화면 밖으로 밀어내는 방식으로 숨긴다.
    -->
    <img
      src="/meta-content-small.jpg"
      width="1200"
      height="630"
      alt="제형 ❤️ 민아 결혼합니다"
      aria-hidden="true"
      style="
        position: absolute;
        left: -99999px;
        top: 0;
        width: 1200px;
        height: 630px;
        pointer-events: none;
      "
    />

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
